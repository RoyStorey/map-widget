<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Atlas — iframe embed example</title>
    <style>
      body { margin: 0; font-family: system-ui, sans-serif; background: #f4f1ea; color: #222; }
      main { max-width: 1000px; margin: 0 auto; padding: 24px; }
      iframe { width: 100%; height: 560px; border: 0; border-radius: 12px; box-shadow: 0 8px 30px rgba(0,0,0,.2); }
      .controls { display: flex; gap: 8px; flex-wrap: wrap; margin: 12px 0; }
      button { padding: 6px 12px; border-radius: 6px; border: 1px solid #bbb; background: #fff; cursor: pointer; }
      #log { font: 12px ui-monospace, monospace; color: #555; }
    </style>
  </head>
  <body>
    <main>
      <h1>The Mongol conquests</h1>
      <p>This page embeds the widget in viewer mode and drives it with <code>postMessage</code> — the buttons below are part of this host page, not the widget.</p>
      <iframe id="atlas" src="../index.html?demo=mongol&embed=1&viewer=1"></iframe>
      <div class="controls">
        <button data-call='["play"]'>▶ Play</button>
        <button data-call='["pause"]'>⏸ Pause</button>
        <button data-call='["setTime",1206]'>1206 · Kurultai</button>
        <button data-call='["setTime",1221]'>1221 · Khwarezm</button>
        <button data-call='["setTime",1241.3]'>1241 · Europe</button>
        <button data-call='["setTime",1258.1]'>1258 · Baghdad</button>
        <button data-call='["updateSettings",{"director":true}]'>🎬 Director on</button>
        <button data-call='["updateSettings",{"projection":"mercator"}]'>Flat map</button>
        <button data-call='["updateSettings",{"projection":"globe"}]'>Globe</button>
      </div>
      <div id="log">Waiting for widget…</div>
    </main>
    <script>
      const frame = document.getElementById('atlas');
      let id = 0;
      const pending = new Map();
      function call(method, ...args) {
        return new Promise((resolve, reject) => {
          const i = ++id;
          pending.set(i, { resolve, reject });
          frame.contentWindow.postMessage({ type: 'atlas', id: i, method, args }, '*');
        });
      }
      window.addEventListener('message', (ev) => {
        const m = ev.data;
        if (m?.type === 'atlas:result') {
          const p = pending.get(m.id);
          pending.delete(m.id);
          m.error ? p?.reject(new Error(m.error)) : p?.resolve(m.result);
        } else if (m?.type === 'atlas:event' && m.name === 'time') {
          document.getElementById('log').textContent = `time: ${m.payload.toFixed(2)}`;
        } else if (m?.type === 'atlas:event' && m.name === 'select') {
          document.getElementById('log').textContent = `selected: ${JSON.stringify(m.payload)}`;
        }
      });
      document.querySelectorAll('[data-call]').forEach((b) =>
        b.addEventListener('click', () => {
          const [method, ...args] = JSON.parse(b.dataset.call);
          call(method, ...args).catch((e) => (document.getElementById('log').textContent = e.message));
        }),
      );
    </script>
  </body>
</html>
